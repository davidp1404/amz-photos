[project]
name = "amz-download"
dynamic = ["version"]
description = "One-way incremental backup from Amazon Photos to a local library"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "David Palau", email = "david.palau@gmail.com" },
]
keywords = [
    "amazon-photos",
    "backup",
    "cli",
    "photo-sync",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
amz-download = "amz_download.cli:main"

[project.urls]
Homepage = "https://github.com/davidp1404/amz-photos"
Repository = "https://github.com/davidp1404/amz-photos"
Issues = "https://github.com/davidp1404/amz-photos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/amz_download/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/amz_download"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
