[project]
name = "amz-download"
dynamic = ["version"]
description = "One-way incremental backup from Amazon Photos to a local library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
amz-download = "amz_download.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/amz_download/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/amz_download"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
